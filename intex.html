<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Website</title>
    <style>
        /* This is CSS - it makes the site look nice */
        body {
            font-family: sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        main {
            padding: 20px;
            max-width: 800px;
            margin: auto;
            background: white;
        }
        footer {
            text-align: center;
            padding: 10px;
            font-size: 0.8rem;
            color: #777;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <main>
        <h2>About This Page</h2>
        <p>This is a simple website created using <strong>HTML</strong> and <strong>CSS</strong>. It is fully responsive, meaning it looks good on both computers and phones.</p>
        
        <h3>My Favorite Things</h3>
        <ul>
            <li>Coding and AI</li>
            <li>Coffee</li>
            <li>Exploring the world</li>
        </ul>

        <button onclick="alert('Hello! Thanks for clicking.')">Click Me!</button>
    </main>

    <footer>
        <p>&copy; 2026 My Web Project</p>
    </footer>

</body>
</html>
